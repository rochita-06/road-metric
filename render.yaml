services:
  - type: web
    name: road-metric-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m ml.training
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FRONTEND_ORIGINS
        sync: false